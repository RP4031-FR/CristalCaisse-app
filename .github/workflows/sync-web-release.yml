name: Synchroniser les Releases web et publier les applications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cristalcaisse-release-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      version: ${{ steps.sync.outputs.version }}
      tag: ${{ steps.sync.outputs.tag }}
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - name: Récupérer le dépôt de l'application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détecter et importer la dernière Release web publiée
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! RELEASE="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/RP4031-FR/CristalCaisse-web/releases/latest)"; then
            echo "::notice::Aucune Release publiée trouvée sur CristalCaisse-web."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' <<< "$RELEASE")"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag de version invalide : $TAG (format attendu : vX.Y.Z)"
            exit 1
          fi

          ASSET_URL="$(python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d.get("assets",[]) if x["name"]=="CristalCaisse.html"]; print(a[0]["browser_download_url"] if a else "")' <<< "$RELEASE")"
          if [[ -z "$ASSET_URL" ]]; then
            echo "::notice::La Release source $TAG ne contient pas l'asset CristalCaisse.html. Rien à publier."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="$(node -p "require('./desktop/package.json').version")"
          if [[ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" == "$CURRENT" ]]; then
            echo "::notice::La version $VERSION n'est pas plus récente que $CURRENT."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -fsSL "$ASSET_URL" -o /tmp/CristalCaisse.html
          if ! grep -q "CURRENT_VERSION" /tmp/CristalCaisse.html; then
            echo "::error::La constante CURRENT_VERSION est introuvable dans le HTML source."
            exit 1
          fi
          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const file = '/tmp/CristalCaisse.html';
          let html = fs.readFileSync(file, 'utf8');
          const version = process.env.VERSION;
          const updated = html.replace(/(const\s+CURRENT_VERSION\s*=\s*)['"][^'"]+['"]/, (_, prefix) => prefix + "'" + version + "'");
          if (updated === html) throw new Error('Impossible de mettre à jour CURRENT_VERSION');
          fs.writeFileSync(file, updated);
          NODE

          cp /tmp/CristalCaisse.html desktop/index.html
          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const file = 'desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.version = process.env.VERSION;
          pkg.build.publish = { provider: 'github', owner: 'RP4031-FR', repo: 'CristalCaisse-app' };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/index.html desktop/package.json
          git commit -m "Synchroniser CristalCaisse $VERSION depuis le dépôt web"
          git push
          COMMIT="$(git rev-parse HEAD)"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        working-directory: desktop
        run: npm install

      - name: Compiler sans publier
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Déposer les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          path: dist
          merge-multiple: true

      - name: Publier une seule Release dans CristalCaisse-app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          gh release create "$TAG" dist/* \
            --repo RP4031-FR/CristalCaisse-app \
            --title "CristalCaisse $VERSION" \
            --notes "Version $VERSION de CristalCaisse. Cette version est synchronisée automatiquement depuis la Release publiée sur CristalCaisse-web."
